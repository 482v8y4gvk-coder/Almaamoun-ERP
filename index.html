<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#132b45"><title>AL-MAAMOUN ERP</title>
<style>
:root{--navy:#132b45;--blue:#2467a5;--bg:#f3f6fa;--line:#e1e7ef;--text:#172536;--muted:#68788b;--green:#16845b;--red:#c13d45;--amber:#b87916}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial;color:var(--text)}button,input,select{font:inherit}header{background:var(--navy);color:#fff;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header h1{font-size:19px;margin:0;letter-spacing:.5px}header small{color:#c8d6e5}.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 68px)}nav{background:#fff;border-left:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:6px}.navbtn{border:0;background:transparent;text-align:right;padding:12px;border-radius:10px;color:#304257;cursor:pointer}.navbtn.active,.navbtn:hover{background:#eaf2fa;color:var(--blue);font-weight:700}main{padding:22px;max-width:1400px;width:100%;margin:auto}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}h2{font-size:22px;margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 2px 8px #17253608}.metric{font-size:27px;font-weight:750;margin-top:8px}.metric-label{color:var(--muted);font-size:13px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;overflow:auto}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--red)}input,select{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;min-width:0;width:100%}.search{max-width:360px}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:right;padding:11px 9px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:650;background:#f8fafc}.pill{display:inline-block;padding:4px 9px;border-radius:30px;background:#edf3f8;color:#38536f;font-size:11px}.pill.ok{background:#e7f6ef;color:var(--green)}.pill.warn{background:#fff4df;color:var(--amber)}.pill.bad{background:#fdebed;color:var(--red)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field.full{grid-column:1/-1}.empty{padding:30px;text-align:center;color:var(--muted)}.notice{background:#fff8e9;border:1px solid #f0dfb8;border-radius:12px;padding:12px;color:#725016;font-size:13px;margin-top:14px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#07182788;display:grid;place-items:center;padding:16px;z-index:5}.modalbox{background:#fff;border-radius:16px;padding:20px;width:min(700px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.lineitems{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end;margin:8px 0}.material-picker-wrap{position:relative}.material-suggestions{position:absolute;z-index:10;top:100%;right:0;left:0;max-height:220px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px;box-shadow:0 8px 24px #17253622}.foot{font-size:11px;color:var(--muted);margin-top:20px;line-height:1.7}
@media(max-width:850px){.shell{grid-template-columns:1fr}nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-left:0;border-bottom:1px solid var(--line)}main{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}
@media(max-width:480px){header{padding:14px}.grid{gap:8px}.card{padding:12px}.metric{font-size:22px}.navbtn{font-size:12px;padding:10px}.lineitems{grid-template-columns:1fr 1fr}.lineitems .field:first-child{grid-column:1/-1}}
</style></head>
<body>
<header><div><h1>AL-MAAMOUN ERP</h1><small>نظام إدارة التكاليف والتسعير والربحية</small></div><div class="actions"><button class="btn" onclick="exportData()">تصدير نسخة احتياطية</button><button class="btn" onclick="document.getElementById('restoreFile').click()">استعادة نسخة</button><input id="restoreFile" type="file" accept="application/json" class="hidden" onchange="importData(event)"><small>نسخة تطوير محلية · v0.9</small></div></header>
<div class="shell"><nav id="nav">
<button class="navbtn active" data-page="dashboard">▦ لوحة التحكم</button>
<button class="navbtn" data-page="materials">▤ المواد الأولية</button>
<button class="navbtn" data-page="mattress">▥ مواد المراتب</button>
<button class="navbtn" data-page="textile">▧ النسيج</button>
<button class="navbtn" data-page="fiber">◈ الفايبر</button>
<button class="navbtn" data-page="products">▣ المنتجات</button>
<button class="navbtn" data-page="rules">⚙ قواعد الحساب</button>
<button class="navbtn" data-page="alerts">♧ التنبيهات</button>
<button class="navbtn" data-page="audit">◷ سجل التغييرات</button>
<button class="navbtn" data-page="users">♙ المستخدمون والصلاحيات</button>
<button class="navbtn" data-page="excel">▦ بيانات Excel المستوردة</button>
</nav><main id="main"></main></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h3 id="modalTitle">إضافة</h3><button class="btn" onclick="closeModal()">إغلاق ✕</button></div><div id="modalBody"></div></div></div>
<script>
const sections={materials:'المواد الأولية',mattress:'مواد المراتب',textile:'النسيج',fiber:'الفايبر'};
const seed={fx:48.5,materials:[],products:[],rules:[],audit:[],users:[],sectionNames:{}};
let db;try{db=JSON.parse(localStorage.getItem('almaamoun_demo'))||seed}catch(e){db=seed}
function inferMaterialGroup(m){const n=String(m.name||'').toLowerCase();if(m.section==='fiber')return /شعيرات/.test(n)?'شعيرات الفايبر':'رولات وأنواع الفايبر';if(m.section==='mattress')return 'أسلاك ومكونات المراتب';if(m.section==='textile')return 'خدمات النسيج والتجهيز';if(/شنطة|كرتونة|نايلون|كيس/.test(n))return 'مستلزمات التعبئة والتغليف';if(/قماش|cotton|polyester|fur|jaquard|satin|ساتان|فيلفت|فيلور|ميلتون|مخلوط|سبن/.test(n))return 'الأقمشة والخامات النسيجية';if(/بريم|فيزلين|حديد|كادر/.test(n))return 'مستلزمات التصنيع والإكسسوارات';return 'خامات أخرى'}
db.sectionNames=db.sectionNames||{};db.materials=(db.materials||[]).map(m=>({...m,group:m.group||inferMaterialGroup(m)}));
let page='dashboard';function save(){localStorage.setItem('almaamoun_demo',JSON.stringify(db))}
function sectionLabel(key){return (db.sectionNames&&db.sectionNames[key])||sections[key]||key}
function renameSection(key){const old=sectionLabel(key);const next=prompt('اكتب الاسم الجديد للقسم:',old);if(next===null)return;const clean=next.trim();if(!clean)return alert('اسم القسم لا يمكن أن يكون فارغاً');if(clean.length>50)return alert('اسم القسم طويل جداً');db.sectionNames=db.sectionNames||{};db.sectionNames[key]=clean;audit('تغيير اسم قسم المواد',old+' ← '+clean);render()} 
function exportData(){const blob=new Blob([JSON.stringify({format:'almaamoun-erp-backup-v1',exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='almaamoun-erp-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);const d=x.data||x;if(!Array.isArray(d.materials)||!Array.isArray(d.products))throw Error('bad');if(!confirm('سيتم استبدال بيانات هذا المتصفح بالنسخة المختارة. هل تريد المتابعة؟'))return;db={...seed,...d};save();render();alert('تمت استعادة النسخة الاحتياطية')}catch(_){alert('الملف غير صالح أو ليس نسخة احتياطية من النظام')}e.target.value=''};r.readAsText(f)}
function money(n){return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2})+' ج.م'}function matPrice(m){return m.currency==='USD'?m.price*db.fx:m.price}function materialSubtotal(p){
 const lines=p.lines||[];
 const fixed=lines.reduce((s,l)=>{if(l.mode==='percent')return s;const m=db.materials.find(x=>x.id==l.materialId);return s+(m?matPrice(m)*Number(l.qty||0):0)},0);
 const percent=lines.reduce((s,l)=>{if(l.mode!=='percent')return s;const m=db.materials.find(x=>x.id==l.materialId);return s+(m?fixed*Number(l.qty||0)/100:0)},0);
 return fixed+percent;
}
function laborCost(p){return materialSubtotal(p)*Number(p.laborRate??0)/100}
function expenseTotal(p){
 const base=(p.imported&&!(p.lines||[]).length?Number(p.importedCost||0):materialSubtotal(p)+laborCost(p));
 return (p.expenses||[]).reduce((sum,e)=>sum+(e.mode==='percent'?base*Number(e.value||0)/100:Number(e.value||0)),0);
}
function cost(p){
 if(p.imported&&!(p.lines||[]).length&&Number.isFinite(Number(p.importedCost)))return Number(p.importedCost)+expenseTotal(p)+Number(p.overhead||0)+Number(p.labor||0);
 return materialSubtotal(p)+laborCost(p)+expenseTotal(p)+Number(p.overhead||0)+Number(p.labor||0);
}
function wholesalePrice(p){return Number(p.price||0)*(1-Number(p.wholesaleDiscount||0)/100)}function margin(p){let c=cost(p);return p.price?((p.price-c)/p.price*100):0}function alerts(){return db.products.filter(p=>p.thresholdType==='percent'?margin(p)<p.threshold:(p.price-cost(p))<p.threshold)}function audit(action,detail){db.audit.unshift({at:new Date().toLocaleString('ar-EG'),action,detail,user:'مستخدم محلي'});save()}
function render(){document.querySelectorAll('.navbtn').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);if(sections[b.dataset.page]){const icons={materials:'▤',mattress:'▥',textile:'▧',fiber:'◈'};b.textContent=icons[b.dataset.page]+' '+sectionLabel(b.dataset.page)}});let el=document.getElementById('main');if(page==='dashboard')el.innerHTML=dashboard();else if(sections[page])el.innerHTML=materialsPage(page);else if(page==='products')el.innerHTML=productsPage();else if(page==='rules')el.innerHTML=rulesPage();else if(page==='alerts')el.innerHTML=alertsPage();else if(page==='audit')el.innerHTML=auditPage();else if(page==='users')el.innerHTML=usersPage();else if(page==='excel'){el.innerHTML=excelPage();renderExcelSheet()}}
function dashboard(){let a=alerts();return `<div class="topline"><div><h2>لوحة التحكم</h2><div class="muted">نظرة عامة على بيانات التكلفة والربحية</div></div><span class="pill warn">أدخل بياناتك أو استعد نسخة احتياطية</span></div><div class="grid"><div class="card"><div class="metric-label">المواد المسجلة</div><div class="metric">${db.materials.length}</div></div><div class="card"><div class="metric-label">المنتجات المسجلة</div><div class="metric">${db.products.length}</div></div><div class="card"><div class="metric-label">منتجات تحت حد الربح</div><div class="metric" style="color:${a.length?'var(--red)':'var(--green)'}">${a.length}</div></div><div class="card"><div class="metric-label">سعر الدولار الحالي</div><div class="metric">${db.fx||'—'}</div></div></div><div class="panel"><h3>المنتجات والربحية</h3>${productsTable(db.products)}</div><div class="notice">الحفظ في هذه النسخة يتم داخل المتصفح الحالي فقط. استخدم «تصدير نسخة احتياطية» بانتظام. لا توجد قاعدة بيانات سحابية أو تسجيل دخول فعلي أو رسائل بريدية حتى الآن.</div>`}
function productsTable(list){if(!list.length)return '<div class="empty">لا توجد منتجات بعد</div>';return `<table><thead><tr><th>المنتج</th><th>التكلفة</th><th>سعر المستهلك</th><th>سعر الجملة</th><th>ربح المستهلك</th><th>ربح الجملة</th><th>هامش المستهلك</th><th>الحالة</th><th>تفاصيل</th></tr></thead><tbody>${list.map(p=>{let ok=p.thresholdType==='percent'?margin(p)>=p.threshold:(p.price-cost(p))>=p.threshold;return `<tr><td><b>${esc(p.name)}</b><div class="muted">${esc(p.code||'')}</div></td><td>${money(cost(p))}</td><td>${money(p.price)}</td><td>${money(wholesalePrice(p))}</td><td>${money(p.price-cost(p))}</td><td>${money(wholesalePrice(p)-cost(p))}</td><td>${margin(p).toFixed(1)}%</td><td><span class="pill ${ok?'ok':'bad'}">${ok?'ضمن الحد':'أقل من الحد'}</span></td><td><button class="btn" onclick="productDetails(${p.id})">عرض</button> <button class="btn" onclick="productForm(${p.id})">تعديل</button></td></tr>`}).join('')}</tbody></table>`}
function productDetails(id){const p=db.products.find(x=>x.id===id);if(!p)return;const lines=(p.lines||[]).map(l=>{const m=db.materials.find(x=>x.id==l.materialId);return `<tr><td>${esc(m?.name||'مادة غير موجودة')}</td><td>${l.mode==='percent'?l.qty+'% من الخامات الأساسية':l.qty}</td><td>${money(m?matPrice(m):0)}</td><td>${money(m?(l.mode==='percent'?materialSubtotal(p)*l.qty/100:matPrice(m)*l.qty):0)}</td></tr>`}).join('');openModal('تفاصيل تكلفة المنتج',`<h3>${esc(p.name)}</h3><div class="muted">الكود: ${esc(p.code||'—')} · المجموعة: ${esc(p.category||'—')}</div>${p.imported?`<div class="notice">بيانات مستوردة من ${esc(p.sourceSheet)} – الصف ${p.sourceRow}. هذه تكلفة Excel المرجعية؛ أضف تركيبة مواد لتحويل المنتج إلى حساب حي.</div>`:''}<table><thead><tr><th>المادة</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr></thead><tbody>${lines||'<tr><td colspan="4">لا توجد مواد مرتبطة</td></tr>'}</tbody></table>${p.imported&&p.excelBreakdown?.length?`<div class="panel"><h4>تفصيل التكلفة المنقول من Excel</h4><table><thead><tr><th>البند</th><th>القيمة</th></tr></thead><tbody>${p.excelBreakdown.map(x=>`<tr><td>${esc(x.name)}</td><td>${money(x.amount)}</td></tr>`).join('')}</tbody></table></div>`:''}<div class="panel"><p>إجمالي المواد: <b>${money((p.lines||[]).reduce((s,l)=>{const m=db.materials.find(x=>x.id==l.materialId);return s+(m?matPrice(m)*l.qty:0)},0))}</b></p><p>مصنعية التشغيل (${Number(p.laborRate||0)}%): <b>${money(laborCost(p))}</b></p><p>المصاريف الإضافية: <b>${money(expenseTotal(p)+Number(p.overhead||0))}</b></p>${(p.expenses||[]).length?`<table><thead><tr><th>اسم المصروف</th><th>الطريقة</th><th>القيمة</th></tr></thead><tbody>${p.expenses.map(e=>`<tr><td>${esc(e.name)}</td><td>${e.mode==='percent'?'نسبة %':'مبلغ ثابت'}</td><td>${e.mode==='percent'?e.value+'%':money(e.value)}</td></tr>`).join('')}</tbody></table>`:''}<p>إجمالي التكلفة: <b>${money(cost(p))}</b></p><p>سعر المستهلك: <b>${money(p.price)}</b> · ربح المستهلك: <b>${money(p.price-cost(p))}</b></p><p>خصم الجملة: <b>${Number(p.wholesaleDiscount||0)}%</b> · سعر الجملة: <b>${money(wholesalePrice(p))}</b> · ربح الجملة: <b>${money(wholesalePrice(p)-cost(p))}</b></p><p>هامش ربح المستهلك: <b>${margin(p).toFixed(2)}%</b></p></div>`)}
let materialGroupFilter={};
function materialsPage(sec){let all=db.materials.filter(m=>m.section===sec);let groups=[...new Set(all.map(m=>m.group||'مواد أخرى'))].sort();let chosen=materialGroupFilter[sec]||'all';let arr=chosen==='all'?all:all.filter(m=>(m.group||'مواد أخرى')===chosen);return `<div class="topline"><div><h2>${esc(sectionLabel(sec))}</h2><div class="muted">مجموعات مستقلة داخل هذا القسم — ${all.length} مادة</div></div><div class="actions"><button class="btn" onclick="renameSection('${sec}')">✎ تعديل اسم القسم</button><button class="btn primary" onclick="materialForm('${sec}')">＋ إضافة مادة</button></div></div><div class="panel"><div class="formgrid"><div class="field"><label>مجموعة المواد</label><select onchange="materialGroupFilter['${sec}']=this.value;render()"><option value="all" ${chosen==='all'?'selected':''}>كل المجموعات (${all.length})</option>${groups.map(g=>`<option value="${esc(g)}" ${chosen===g?'selected':''}>${esc(g)} (${all.filter(m=>(m.group||'مواد أخرى')===g).length})</option>`).join('')}</select></div><div class="field"><label>بحث داخل المجموعة</label><input class="search" placeholder="اسم المادة أو الوحدة..." oninput="filterRows(this,'mat-${sec}')"></div></div><table id="mat-${sec}"><thead><tr><th>اسم المادة</th><th>المجموعة</th><th>الوحدة</th><th>السعر الأصلي</th><th>العملة</th><th>السعر بالجنيه</th><th></th></tr></thead><tbody>${arr.map(m=>`<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.group||'مواد أخرى')}</td><td>${esc(m.unit)}</td><td>${m.price}</td><td>${m.currency}</td><td>${money(matPrice(m))}</td><td><button class="btn" onclick="materialForm('${sec}',${m.id})">تعديل</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">لا توجد مواد في هذه المجموعة</td></tr>'}</tbody></table></div>`}

function rulesPage(){db.laborRates=db.laborRates||{general:15,mattress:15};return `<div class="topline"><div><h2>قواعد الحساب ومصادر الأسعار</h2></div></div><div class="panel"><h3>نسب مصنعية التشغيل الافتراضية</h3><div class="formgrid"><div class="field"><label>باقي المنتجات %</label><input id="lrg" type="number" step="0.01" value="${db.laborRates.general}"></div><div class="field"><label>المراتب %</label><input id="lrm" type="number" step="0.01" value="${db.laborRates.mattress}"></div></div><button class="btn primary" onclick="db.laborRates={general:Number(document.getElementById('lrg').value),mattress:Number(document.getElementById('lrm').value)};audit('تعديل نسب التشغيل',JSON.stringify(db.laborRates));render()">حفظ نسب التشغيل</button><div class="muted">النسبة الافتراضية من Excel لباقي المنتجات 15%. نسبة المراتب قابلة للتحديد بشكل مستقل.</div></div><div class="panel"><div class="field" style="max-width:280px"><label>سعر الدولار بالجنيه</label><input id="fx" type="number" step="0.01" value="${db.fx||''}"></div><button class="btn primary" style="margin-top:10px" onclick="updateFx()">حفظ سعر الصرف</button></div><div class="panel"><h3>قواعد الحساب</h3><table><thead><tr><th>القاعدة</th><th>النطاق</th><th>الوصف</th><th>القيمة</th><th></th></tr></thead><tbody>${db.rules.map((r,i)=>`<tr><td>${esc(r.name)}</td><td>${esc(r.scope)}</td><td>${esc(r.description)}</td><td>${esc(r.value)}</td><td><button class="btn" onclick="editRule(${i})">تعديل</button></td></tr>`).join('')||'<tr><td colspan="5">لا توجد قواعد بعد</td></tr>'}</tbody></table></div>`}
function alertsPage(){let a=alerts();return `<div class="topline"><div><h2>التنبيهات</h2><div class="muted">مراقبة حد الربح المحدد لكل منتج</div></div></div><div class="panel">${a.length?productsTable(a):'<div class="empty">لا توجد منتجات تحت حد الربح حالياً</div>'}<div class="notice">تنبيهات البريد الإلكتروني غير مفعلة في هذه النسخة.</div></div>`}
function auditPage(){return `<div class="topline"><div><h2>سجل التغييرات</h2></div></div><div class="panel"><table><thead><tr><th>التاريخ</th><th>المستخدم</th><th>الإجراء</th><th>التفاصيل</th></tr></thead><tbody>${db.audit.map(x=>`<tr><td>${esc(x.at)}</td><td>${esc(x.user)}</td><td>${esc(x.action)}</td><td>${esc(x.detail)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">لا توجد تغييرات مسجلة بعد</td></tr>'}</tbody></table></div>`}

 <div class="panel"><div class="field" style="max-width:420px"><label>اختر ورقة العمل</label><select id="excelSheet" onchange="renderExcelSheet()">${opts}</select></div><div id="excelSheetView" style="margin-top:14px"></div></div>
 <div class="notice">يعرض هذا الإصدار الصيغ الأصلية والقيم المحسوبة داخل التطبيق للمعادلات المدعومة (المراجع بين الأوراق، العمليات الحسابية، SUM وIF). راجع أي خلية تظهر ‎#CALC!‎ قبل اعتمادها، فالمحرك ما زال بحاجة إلى اختبارات مطابقة كاملة مع Excel.</div>`;
}

function excelCellValue(sheetName, rowNum, colNum, stack=[]){
 const sheets=db.excelWorkbook?.sheets||[];
 const sh=sheets.find(x=>x.name===sheetName);
 if(!sh||rowNum<1||colNum<1)return 0;
 const key=sheetName+'!'+excelColName(colNum)+rowNum;
 if(stack.includes(key))return 0;
 const raw=sh.rows?.[rowNum-1]?.[colNum-1];
 if(raw===null||raw===undefined||raw==='')return 0;
 if(typeof raw==='number')return raw;
 if(typeof raw==='object'&&raw.formula)return excelEvalFormula(raw.formula,stack.concat(key));
 if(typeof raw==='string'&&raw.startsWith('='))return excelEvalFormula(raw,stack.concat(key));
 const n=Number(raw);return Number.isFinite(n)?n:raw;
}
function excelColName(n){let x='';while(n){let r=(n-1)%26;x=String.fromCharCode(65+r)+x;n=Math.floor((n-1)/26)}return x}
function excelEvalFormula(formula,stack=[]){
 try{
  let expr=String(formula).replace(/^=/,'');
  const rangeRe=/SUM\(\s*(?:(?:'([^']+)'|([A-Za-z_][A-Za-z0-9_ ]*))!)?(\$?[A-Z]{1,3}\$?\d+):(\$?[A-Z]{1,3}\$?\d+)\s*\)/gi;
  expr=expr.replace(rangeRe,(all,qSheet,uSheet,a,b)=>{
   const sn=qSheet||uSheet||'';
   const parse=x=>{const m=x.replace(/\$/g,'').match(/^([A-Z]+)(\d+)$/i);let c=0;for(const ch of m[1].toUpperCase())c=c*26+ch.charCodeAt(0)-64;return {c,r:Number(m[2])}};
   const p1=parse(a),p2=parse(b);let vals=[];
   for(let rr=Math.min(p1.r,p2.r);rr<=Math.max(p1.r,p2.r);rr++)for(let cc=Math.min(p1.c,p2.c);cc<=Math.max(p1.c,p2.c);cc++)vals.push(excelCellValue(sn||stack[stack.length-1]?.split('!')[0],rr,cc,stack));
   return 'SUM('+JSON.stringify(vals)+')';
  });
  expr=expr.replace(/(?:'([^']+)'|([A-Za-z_][A-Za-z0-9_ ]*))!([A-Z]{1,3})\$?(\d+)/g,(all,qs,us,col,row)=>{
   let c=0;for(const ch of col.toUpperCase())c=c*26+ch.charCodeAt(0)-64;
   return String(Number(excelCellValue(qs||us,Number(row),c,stack))||0);
  });
  expr=expr.replace(/(?<![A-Z0-9_"])\$?([A-Z]{1,3})\$?(\d+)/gi,(all,col,row)=>{
   let c=0;for(const ch of col.toUpperCase())c=c*26+ch.charCodeAt(0)-64;
   const sn=stack[stack.length-1]?.split('!')[0]||'';
   return String(Number(excelCellValue(sn,Number(row),c,stack))||0);
  });
  const SUM=(...args)=>args.flat(Infinity).reduce((a,b)=>a+(Number(b)||0),0);
  const IF=(condition,yes,no)=>condition?yes:no;
  const value=Function('SUM','IF','return ('+expr+')')(SUM,IF);
  return typeof value==='number'&&Number.isFinite(value)?value:value;
 }catch(e){return '#CALC!'}
}

function renderExcelSheet(){
 const sheets=db.excelWorkbook?.sheets||[];const sel=document.getElementById('excelSheet');const view=document.getElementById('excelSheetView');if(!sel||!view)return;
 const s=sheets[Number(sel.value)];if(!s)return;
 const colName=n=>{let x='';while(n){let r=(n-1)%26;x=String.fromCharCode(65+r)+x;n=Math.floor((n-1)/26)}return x};
 const cell=(v,r,c)=>{if(v===null||v===undefined)return '';if(typeof v==='object'&&v.formula){const computed=excelCellValue(s.name,r+1,c+1);const shown=typeof computed==='number'?computed.toLocaleString('en-US',{maximumFractionDigits:4}):String(computed);const cached=v.cached===null||v.cached===undefined?'':'القيمة المحفوظة: '+String(v.cached);return '<span title="'+esc(v.formula)+'">'+esc(v.formula)+'</span><div class="pill ok" style="margin-top:5px">المحسوب: '+esc(shown)+'</div>'+(cached?'<div class="muted">'+esc(cached)+'</div>':'')}return esc(String(v))};
 view.innerHTML=`<div class="muted" style="margin-bottom:8px">${esc(s.name)} — ${s.maxRow} صف × ${s.maxColumn} عمود. الصيغ تظهر كما هي عند وجودها.</div><div style="overflow:auto;max-height:65vh"><table style="min-width:900px"><thead><tr><th>رقم الصف</th>${Array.from({length:s.maxColumn},(_,i)=>`<th>${colName(i+1)}</th>`).join('')}</tr></thead><tbody>${s.rows.map((r,i)=>`<tr><td>${i+1}</td>${r.map((v,c)=>`<td>${cell(v,i,c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function filterRows(inp,id){let q=inp.value.toLowerCase();document.querySelectorAll('#'+id+' tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}

 ${p.imported?'<div class="notice">هذا المنتج مستورد من Excel وتكلفته الحالية مرجعية. عند إضافة تركيبة وحفظها، سيبدأ حساب تكلفته من الخامات الحية بدلاً من تكلفة Excel المحفوظة.</div>':''}

 <div class="field"><label>الحد الأدنى</label><input id="pth" type="number" value="${p.threshold??12}"></div></div>
 <h4>المصاريف الإضافية (عدد غير محدود)</h4><div id="expenses">${(p.expenses||[]).map(e=>expenseRow(e)).join('')}</div><button type="button" class="btn" onclick="addExpense()">＋ إضافة مصروف</button><div class="muted">المصروف النسبي يُحسب على تكلفة الخامات + مصنعية التشغيل. ويمكنك إضافة أي عدد من البنود وتسميتها بنفسك.</div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="saveProduct(${id||0})">حفظ المنتج</button></div>`);

function lineRow(l={}){
 const selected=db.materials.find(m=>m.id===l.materialId);const label=selected?selected.name:'';
 return `<div class="lineitems material-line"><div class="field material-picker-wrap"><label>ابحث عن الخامة</label><input class="material-search" value="${esc(label)}" placeholder="اكتب اسم الخامة..." autocomplete="off" oninput="this.parentElement.querySelector('.lm').value='';showMaterialSuggestions(this)"><input class="lm" type="hidden" value="${l.materialId||''}"><div class="material-suggestions hidden"></div><button type="button" class="btn" style="margin-top:5px" onclick="openMaterialChooser(this)">⌕ اختيار من صفحة المواد</button></div><div class="field"><label>طريقة الإدخال</label><select class="lmode" onchange="this.closest('.lineitems').querySelector('.lqtylabel').textContent=this.value==='percent'?'النسبة %':'الكمية'"><option value="qty" ${l.mode!=='percent'?'selected':''}>كمية فعلية</option><option value="percent" ${l.mode==='percent'?'selected':''}>نسبة من تكلفة الخامات الأساسية %</option></select></div><div class="field"><label class="lqtylabel">${l.mode==='percent'?'النسبة %':'الكمية'}</label><input class="lq" type="number" min="0" step="0.0001" value="${l.qty??1}"></div><button type="button" class="btn danger" onclick="this.parentElement.remove()">حذف</button></div>`;
}
function addLine(){document.getElementById('lines').insertAdjacentHTML('beforeend',lineRow());}

function chooseMaterial(btn,id){const row=btn.closest('.material-line');const m=db.materials.find(x=>x.id===id);if(!m)return;row.querySelector('.material-search').value=m.name;row.querySelector('.lm').value=m.id;row.querySelector('.material-suggestions').classList.add('hidden')}

function saveProduct(id){
 const name=document.getElementById('pn').value.trim();if(!name)return alert('أدخل اسم المنتج');
 const lines=[...document.querySelectorAll('#lines .material-line')].filter(r=>r.querySelector('.lm').value).map(r=>({materialId:Number(r.querySelector('.lm').value),mode:r.querySelector('.lmode').value,qty:Number(r.querySelector('.lq').value)}));
 const expenses=[...document.querySelectorAll('#expenses .expense-line')].map(r=>({name:r.querySelector('.exname').value.trim(),mode:r.querySelector('.exmode').value,value:Number(r.querySelector('.exvalue').value||0)})).filter(e=>e.name);
 const prior=id?db.products.find(x=>x.id===id):null;
 const category=document.getElementById('pg').value;
 const p={...(prior||{}),id:id||Date.now(),name,code:document.getElementById('pc').value,category,price:Number(document.getElementById('pp').value),wholesaleDiscount:Math.min(100,Math.max(0,Number(document.getElementById('pwd').value||0))),expenses,lines,laborRate:Number(document.getElementById('lr').value||0),labor:0,overhead:Number(document.getElementById('po').value||0),thresholdType:document.getElementById('pt').value,threshold:Number(document.getElementById('pth').value),imported:lines.length?false:!!prior?.imported};
 if(lines.length){delete p.importedCost;delete p.importedWholesale;delete p.importedProfit;delete p.importedMargin;}
 else if(prior?.imported){p.imported=true;p.importedCost=prior.importedCost;}
 if(id)db.products=db.products.map(x=>x.id===id?p:x);else db.products.push(p);
 audit(id?'تعديل تركيبة منتج':'إضافة منتج',name);closeModal();render();
}
function updateFx(){let v=Number(document.getElementById('fx').value);if(!(v>0))return alert('سعر صرف غير صحيح');db.fx=v;audit('تعديل سعر الدولار',String(v));render()}
function editRule(i){let r=db.rules[i];openModal('تعديل قاعدة الحساب',`<div class="field"><label>اسم القاعدة</label><input id="rn" value="${esc(r.name)}"></div><div class="field" style="margin-top:10px"><label>الوصف</label><input id="rd" value="${esc(r.description)}"></div><div class="field" style="margin-top:10px"><label>القيمة</label><input id="rv" value="${esc(r.value)}"></div><button class="btn primary" style="margin-top:14px" onclick="db.rules[${i}].name=document.getElementById('rn').value;db.rules[${i}].description=document.getElementById('rd').value;db.rules[${i}].value=document.getElementById('rv').value;audit('تعديل قاعدة حساب',db.rules[${i}].name);closeModal();render()">حفظ التغيير</button>`)}
function userForm(){openModal('إضافة مستخدم (عرض توضيحي)',`<div class="field"><label>اسم المستخدم</label><input id="un"></div><div class="field" style="margin-top:10px"><label>الدور</label><select id="ur"><option>Accountant</option><option>Production</option><option>Materials</option><option>Viewer</option></select></div><button class="btn primary" style="margin-top:14px" onclick="let n=document.getElementById('un').value.trim();if(!n)return alert('أدخل الاسم');db.users.push({name:n,role:document.getElementById('ur').value,permissions:'تحدد لاحقاً'});audit('إضافة مستخدم',n);closeModal();render()">إضافة</button>`)}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}});render();
</script></body></html>
