<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#132b45"><title>AL-MAAMOUN ERP</title>
<style>
:root{--navy:#132b45;--blue:#2467a5;--bg:#f3f6fa;--line:#e1e7ef;--text:#172536;--muted:#68788b;--green:#16845b;--red:#c13d45;--amber:#b87916}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial;color:var(--text)}button,input,select{font:inherit}header{background:var(--navy);color:#fff;padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header h1{font-size:19px;margin:0;letter-spacing:.5px}header small{color:#c8d6e5}.shell{display:grid;grid-template-columns:230px 1fr;min-height:calc(100vh - 68px)}nav{background:#fff;border-left:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:6px}.navbtn{border:0;background:transparent;text-align:right;padding:12px;border-radius:10px;color:#304257;cursor:pointer}.navbtn.active,.navbtn:hover{background:#eaf2fa;color:var(--blue);font-weight:700}main{padding:22px;max-width:1400px;width:100%;margin:auto}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}h2{font-size:22px;margin:0 0 5px}.muted{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 2px 8px #17253608}.metric{font-size:27px;font-weight:750;margin-top:8px}.metric-label{color:var(--muted);font-size:13px}.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;overflow:auto}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:var(--red)}input,select{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fff;min-width:0;width:100%}.search{max-width:360px}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:right;padding:11px 9px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted);font-weight:650;background:#f8fafc}.pill{display:inline-block;padding:4px 9px;border-radius:30px;background:#edf3f8;color:#38536f;font-size:11px}.pill.ok{background:#e7f6ef;color:var(--green)}.pill.warn{background:#fff4df;color:var(--amber)}.pill.bad{background:#fdebed;color:var(--red)}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.field.full{grid-column:1/-1}.empty{padding:30px;text-align:center;color:var(--muted)}.notice{background:#fff8e9;border:1px solid #f0dfb8;border-radius:12px;padding:12px;color:#725016;font-size:13px;margin-top:14px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#07182788;display:grid;place-items:center;padding:16px;z-index:5}.modalbox{background:#fff;border-radius:16px;padding:20px;width:min(700px,100%);max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.lineitems{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end;margin:8px 0}.foot{font-size:11px;color:var(--muted);margin-top:20px;line-height:1.7}
@media(max-width:850px){.shell{grid-template-columns:1fr}nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border-left:0;border-bottom:1px solid var(--line)}main{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}}
@media(max-width:480px){header{padding:14px}.grid{gap:8px}.card{padding:12px}.metric{font-size:22px}.navbtn{font-size:12px;padding:10px}.lineitems{grid-template-columns:1fr 1fr}.lineitems .field:first-child{grid-column:1/-1}}
</style></head>
<body>
<header><div><h1>AL-MAAMOUN ERP</h1><small>نظام إدارة التكاليف والتسعير والربحية</small></div><div class="actions"><button class="btn" onclick="exportData()">تصدير نسخة احتياطية</button><button class="btn" onclick="document.getElementById('restoreFile').click()">استعادة نسخة</button><input id="restoreFile" type="file" accept="application/json" class="hidden" onchange="importData(event)"><small>نسخة تطوير محلية · v0.3</small></div></header>
<div class="shell"><nav id="nav">
<button class="navbtn active" data-page="dashboard">▦ لوحة التحكم</button>
<button class="navbtn" data-page="materials">▤ المواد الأولية</button>
<button class="navbtn" data-page="mattress">▥ مواد المراتب</button>
<button class="navbtn" data-page="textile">▧ النسيج</button>
<button class="navbtn" data-page="fiber">◈ الفايبر</button>
<button class="navbtn" data-page="products">▣ المنتجات</button>
<button class="navbtn" data-page="rules">⚙ قواعد الحساب</button>
<button class="navbtn" data-page="alerts">♧ التنبيهات</button>
<button class="navbtn" data-page="audit">◷ سجل التغييرات</button>
<button class="navbtn" data-page="users">♙ المستخدمون والصلاحيات</button>
<button class="navbtn" data-page="excel">▦ بيانات Excel المستوردة</button>
</nav><main id="main"></main></div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h3 id="modalTitle">إضافة</h3><button class="btn" onclick="closeModal()">إغلاق ✕</button></div><div id="modalBody"></div></div></div>
<script>
const sections={materials:'المواد الأولية',mattress:'مواد المراتب',textile:'النسيج',fiber:'الفايبر'};
const seed={fx:48.5,materials:[],products:[],rules:[],audit:[],users:[]};
let db;try{db=JSON.parse(localStorage.getItem('almaamoun_demo'))||seed}catch(e){db=seed}
let page='dashboard';function save(){localStorage.setItem('almaamoun_demo',JSON.stringify(db))}
function exportData(){const blob=new Blob([JSON.stringify({format:'almaamoun-erp-backup-v1',exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='almaamoun-erp-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href)}
function importData(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);const d=x.data||x;if(!Array.isArray(d.materials)||!Array.isArray(d.products))throw Error('bad');if(!confirm('سيتم استبدال بيانات هذا المتصفح بالنسخة المختارة. هل تريد المتابعة؟'))return;db={...seed,...d};save();render();alert('تمت استعادة النسخة الاحتياطية')}catch(_){alert('الملف غير صالح أو ليس نسخة احتياطية من النظام')}e.target.value=''};r.readAsText(f)}
function money(n){return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2})+' ج.م'}function matPrice(m){return m.currency==='USD'?m.price*db.fx:m.price}function cost(p){return (p.lines||[]).reduce((s,l)=>{let m=db.materials.find(x=>x.id==l.materialId);return s+(m?matPrice(m)*l.qty:0)},0)+Number(p.labor||0)+Number(p.overhead||0)}function margin(p){let c=cost(p);return p.price?((p.price-c)/p.price*100):0}function alerts(){return db.products.filter(p=>p.thresholdType==='percent'?margin(p)<p.threshold:(p.price-cost(p))<p.threshold)}function audit(action,detail){db.audit.unshift({at:new Date().toLocaleString('ar-EG'),action,detail,user:'مستخدم محلي'});save()}
function render(){document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));let el=document.getElementById('main');if(page==='dashboard')el.innerHTML=dashboard();else if(sections[page])el.innerHTML=materialsPage(page);else if(page==='products')el.innerHTML=productsPage();else if(page==='rules')el.innerHTML=rulesPage();else if(page==='alerts')el.innerHTML=alertsPage();else if(page==='audit')el.innerHTML=auditPage();else if(page==='users')el.innerHTML=usersPage()}
function dashboard(){let a=alerts();return `<div class="topline"><div><h2>لوحة التحكم</h2><div class="muted">نظرة عامة على بيانات التكلفة والربحية</div></div><span class="pill warn">أدخل بياناتك أو استعد نسخة احتياطية</span></div><div class="grid"><div class="card"><div class="metric-label">المواد المسجلة</div><div class="metric">${db.materials.length}</div></div><div class="card"><div class="metric-label">المنتجات المسجلة</div><div class="metric">${db.products.length}</div></div><div class="card"><div class="metric-label">منتجات تحت حد الربح</div><div class="metric" style="color:${a.length?'var(--red)':'var(--green)'}">${a.length}</div></div><div class="card"><div class="metric-label">سعر الدولار الحالي</div><div class="metric">${db.fx||'—'}</div></div></div><div class="panel"><h3>المنتجات والربحية</h3>${productsTable(db.products)}</div><div class="notice">الحفظ في هذه النسخة يتم داخل المتصفح الحالي فقط. استخدم «تصدير نسخة احتياطية» بانتظام. لا توجد قاعدة بيانات سحابية أو تسجيل دخول فعلي أو رسائل بريدية حتى الآن.</div>`}
function productsTable(list){if(!list.length)return '<div class="empty">لا توجد منتجات بعد</div>';return `<table><thead><tr><th>المنتج</th><th>التكلفة</th><th>سعر البيع</th><th>الربح</th><th>الهامش</th><th>الحالة</th><th>تفاصيل</th></tr></thead><tbody>${list.map(p=>{let ok=p.thresholdType==='percent'?margin(p)>=p.threshold:(p.price-cost(p))>=p.threshold;return `<tr><td><b>${esc(p.name)}</b><div class="muted">${esc(p.code||'')}</div></td><td>${money(cost(p))}</td><td>${money(p.price)}</td><td>${money(p.price-cost(p))}</td><td>${margin(p).toFixed(1)}%</td><td><span class="pill ${ok?'ok':'bad'}">${ok?'ضمن الحد':'أقل من الحد'}</span></td><td><button class="btn" onclick="productDetails(${p.id})">عرض</button> <button class="btn" onclick="productForm(${p.id})">تعديل</button></td></tr>`}).join('')}</tbody></table>`}
function productDetails(id){const p=db.products.find(x=>x.id===id);if(!p)return;const lines=(p.lines||[]).map(l=>{const m=db.materials.find(x=>x.id==l.materialId);return `<tr><td>${esc(m?.name||'مادة غير موجودة')}</td><td>${l.qty}</td><td>${money(m?matPrice(m):0)}</td><td>${money(m?matPrice(m)*l.qty:0)}</td></tr>`}).join('');openModal('تفاصيل تكلفة المنتج',`<h3>${esc(p.name)}</h3><div class="muted">الكود: ${esc(p.code||'—')} · المجموعة: ${esc(p.category||'—')}</div><table><thead><tr><th>المادة</th><th>الكمية</th><th>سعر الوحدة</th><th>الإجمالي</th></tr></thead><tbody>${lines||'<tr><td colspan="4">لا توجد مواد مرتبطة</td></tr>'}</tbody></table><div class="panel"><p>إجمالي المواد: <b>${money((p.lines||[]).reduce((s,l)=>{const m=db.materials.find(x=>x.id==l.materialId);return s+(m?matPrice(m)*l.qty:0)},0))}</b></p><p>الأجور: <b>${money(p.labor)}</b></p><p>المصاريف الإضافية: <b>${money(p.overhead)}</b></p><p>إجمالي التكلفة: <b>${money(cost(p))}</b></p><p>سعر البيع: <b>${money(p.price)}</b></p><p>الربح: <b>${money(p.price-cost(p))}</b> · هامش الربح: <b>${margin(p).toFixed(2)}%</b></p></div>`)}
function materialsPage(sec){let arr=db.materials.filter(m=>m.section===sec);return `<div class="topline"><div><h2>${sections[sec]}</h2><div class="muted">قسم مستقل؛ لا يتم دمج بياناته مع الأقسام الأخرى</div></div><button class="btn primary" onclick="materialForm('${sec}')">＋ إضافة مادة</button></div><div class="panel"><input class="search" placeholder="بحث بالاسم أو الوحدة أو العملة..." oninput="filterRows(this,'mat-${sec}')"><table id="mat-${sec}"><thead><tr><th>اسم المادة</th><th>الوحدة</th><th>السعر الأصلي</th><th>العملة</th><th>السعر بالجنيه</th><th>مصدر السعر</th><th></th></tr></thead><tbody>${arr.map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.unit)}</td><td>${m.price}</td><td>${m.currency}</td><td>${money(matPrice(m))}</td><td>${m.source==='usd'?'مرتبط بالدولار':'يدوي'}</td><td><button class="btn" onclick="materialForm('${sec}',${m.id})">تعديل</button></td></tr>`).join('')||'<tr><td colspan="7" class="empty">لا توجد مواد في هذا القسم</td></tr>'}</tbody></table></div>`}
function productsPage(){return `<div class="topline"><div><h2>المنتجات</h2><div class="muted">إنشاء تركيبة منتج وربطها بالمواد</div></div><button class="btn primary" onclick="productForm()">＋ إضافة منتج</button></div><div class="panel"><input class="search" placeholder="ابحث باسم المنتج أو الكود أو القسم..." oninput="filterRows(this,'products-table')"><div id="products-table">${productsTable(db.products)}</div></div>`}
function rulesPage(){return `<div class="topline"><div><h2>قواعد الحساب ومصادر الأسعار</h2></div></div><div class="panel"><div class="field" style="max-width:280px"><label>سعر الدولار بالجنيه</label><input id="fx" type="number" step="0.01" value="${db.fx||''}"></div><button class="btn primary" style="margin-top:10px" onclick="updateFx()">حفظ سعر الصرف</button></div><div class="panel"><h3>قواعد الحساب</h3><table><thead><tr><th>القاعدة</th><th>النطاق</th><th>الوصف</th><th>القيمة</th><th></th></tr></thead><tbody>${db.rules.map((r,i)=>`<tr><td>${esc(r.name)}</td><td>${esc(r.scope)}</td><td>${esc(r.description)}</td><td>${esc(r.value)}</td><td><button class="btn" onclick="editRule(${i})">تعديل</button></td></tr>`).join('')||'<tr><td colspan="5">لا توجد قواعد بعد</td></tr>'}</tbody></table></div>`}
function alertsPage(){let a=alerts();return `<div class="topline"><div><h2>التنبيهات</h2><div class="muted">مراقبة حد الربح المحدد لكل منتج</div></div></div><div class="panel">${a.length?productsTable(a):'<div class="empty">لا توجد منتجات تحت حد الربح حالياً</div>'}<div class="notice">تنبيهات البريد الإلكتروني غير مفعلة في هذه النسخة.</div></div>`}
function auditPage(){return `<div class="topline"><div><h2>سجل التغييرات</h2></div></div><div class="panel"><table><thead><tr><th>التاريخ</th><th>المستخدم</th><th>الإجراء</th><th>التفاصيل</th></tr></thead><tbody>${db.audit.map(x=>`<tr><td>${esc(x.at)}</td><td>${esc(x.user)}</td><td>${esc(x.action)}</td><td>${esc(x.detail)}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">لا توجد تغييرات مسجلة بعد</td></tr>'}</tbody></table></div>`}
function usersPage(){return `<div class="topline"><div><h2>المستخدمون والصلاحيات</h2><div class="muted">عرض توضيحي فقط؛ لا توجد حسابات دخول حقيقية</div></div><button class="btn primary" onclick="userForm()">＋ إضافة مستخدم</button></div><div class="panel"><table><thead><tr><th>المستخدم</th><th>الدور</th><th>الصلاحيات</th></tr></thead><tbody>${db.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.role)}</td><td>${esc(u.permissions)}</td></tr>`).join('')||'<tr><td colspan="3">لا يوجد مستخدمون</td></tr>'}</tbody></table><div class="notice">لا تستخدم هذه الصفحة كوسيلة حماية؛ الصلاحيات الحقيقية يجب فرضها على الخادم.</div></div>`}

function excelPage(){
 const sheets=db.excelWorkbook?.sheets||[];
 if(!sheets.length)return `<div class="topline"><div><h2>بيانات Excel المستوردة</h2><div class="muted">لم يتم استيراد ملف Excel بعد</div></div></div><div class="panel empty">استعد ملف ALMAAMOUN_EXCEL_IMPORT.json من زر «استعادة نسخة» أعلى الصفحة.</div>`;
 const opts=sheets.map((s,i)=>`<option value="${i}">${esc(s.name)} (${s.maxRow} × ${s.maxColumn})</option>`).join('');
 return `<div class="topline"><div><h2>بيانات Excel المستوردة</h2><div class="muted">عرض الأوراق الأصلية مع الاحتفاظ بالصيغ والقيم المحفوظة من Excel</div></div><span class="pill ok">${sheets.length} أوراق مستوردة</span></div>
 <div class="panel"><div class="field" style="max-width:420px"><label>اختر ورقة العمل</label><select id="excelSheet" onchange="renderExcelSheet()">${opts}</select></div><div id="excelSheetView" style="margin-top:14px"></div></div>
 <div class="notice">هذا العرض يحفظ الصيغ الأصلية ويعرضها كنص؛ لم يتم تحويل جميع معادلات Excel إلى محرك حساب تلقائي داخل التطبيق بعد. قارن النتائج مع ملف Excel قبل اعتماد أي تكلفة.</div>`;
}
function renderExcelSheet(){
 const sheets=db.excelWorkbook?.sheets||[];const sel=document.getElementById('excelSheet');const view=document.getElementById('excelSheetView');if(!sel||!view)return;
 const s=sheets[Number(sel.value)];if(!s)return;
 const colName=n=>{let x='';while(n){let r=(n-1)%26;x=String.fromCharCode(65+r)+x;n=Math.floor((n-1)/26)}return x};
 const cell=v=>{if(v===null||v===undefined)return '';if(typeof v==='object'&&v.formula){let cached=v.cached===null||v.cached===undefined?'':'\\nالقيمة المحفوظة: '+String(v.cached);return '<span title="'+esc(v.formula+cached)+'">'+esc(v.formula)+(cached?'<div class="muted">'+esc(cached)+'</div>':'')+'</span>'}return esc(String(v))};
 view.innerHTML=`<div class="muted" style="margin-bottom:8px">${esc(s.name)} — ${s.maxRow} صف × ${s.maxColumn} عمود. الصيغ تظهر كما هي عند وجودها.</div><div style="overflow:auto;max-height:65vh"><table style="min-width:900px"><thead><tr><th>رقم الصف</th>${Array.from({length:s.maxColumn},(_,i)=>`<th>${colName(i+1)}</th>`).join('')}</tr></thead><tbody>${s.rows.map((r,i)=>`<tr><td>${i+1}</td>${r.map(v=>`<td>${cell(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function filterRows(inp,id){let q=inp.value.toLowerCase();document.querySelectorAll('#'+id+' tbody tr').forEach(r=>r.style.display=r.innerText.toLowerCase().includes(q)?'':'none')}
function openModal(title,html){document.getElementById('modalTitle').textContent=title;document.getElementById('modalBody').innerHTML=html;document.getElementById('modal').classList.remove('hidden')}function closeModal(){document.getElementById('modal').classList.add('hidden')}
function materialForm(sec,id){let m=db.materials.find(x=>x.id===id)||{name:'',unit:'كجم',price:0,currency:'EGP',source:'manual'};openModal(id?'تعديل مادة':'إضافة مادة',`<div class="formgrid"><div class="field full"><label>اسم المادة</label><input id="mn" value="${esc(m.name)}"></div><div class="field"><label>الوحدة</label><input id="mu" value="${esc(m.unit)}"></div><div class="field"><label>السعر</label><input id="mp" type="number" step="0.0001" value="${m.price}"></div><div class="field"><label>العملة</label><select id="mc"><option value="EGP" ${m.currency==='EGP'?'selected':''}>جنيه مصري</option><option value="USD" ${m.currency==='USD'?'selected':''}>دولار</option></select></div><div class="field"><label>طريقة التسعير</label><select id="ms"><option value="manual">سعر يدوي</option><option value="usd" ${m.source==='usd'?'selected':''}>مرتبط بالدولار</option></select></div></div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="saveMaterial('${sec}',${id||0})">حفظ المادة</button></div>`)}
function saveMaterial(sec,id){let name=document.getElementById('mn').value.trim();if(!name)return alert('أدخل اسم المادة');let obj={id:id||Date.now(),section:sec,name,unit:document.getElementById('mu').value,price:Number(document.getElementById('mp').value),currency:document.getElementById('mc').value,source:document.getElementById('ms').value};if(id)db.materials=db.materials.map(x=>x.id===id?obj:x);else db.materials.push(obj);audit(id?'تعديل مادة':'إضافة مادة',name+' — '+sections[sec]);closeModal();render()}
function productForm(id){let p=db.products.find(x=>x.id===id)||{name:'',code:'',category:'Quilts',lines:[],labor:0,overhead:0,thresholdType:'percent',threshold:15,price:0};let lineHtml=(p.lines||[]).map((l,i)=>lineRow(l,i)).join('');openModal(id?'تعديل منتج':'إضافة منتج',`<div class="formgrid"><div class="field"><label>اسم المنتج</label><input id="pn" value="${esc(p.name)}"></div><div class="field"><label>كود المنتج</label><input id="pc" value="${esc(p.code)}"></div><div class="field"><label>القسم / المجموعة</label><input id="pg" value="${esc(p.category)}"></div><div class="field"><label>سعر البيع بالجنيه</label><input id="pp" type="number" value="${p.price}"></div></div><h4>تركيبة المواد</h4><div id="lines">${lineHtml}</div><button class="btn" onclick="addLine()">＋ إضافة مادة للتركيبة</button><div class="formgrid" style="margin-top:12px"><div class="field"><label>الأجور</label><input id="pl" type="number" value="${p.labor}"></div><div class="field"><label>المصاريف الإضافية</label><input id="po" type="number" value="${p.overhead}"></div><div class="field"><label>نوع حد الربح الأدنى</label><select id="pt"><option value="percent" ${p.thresholdType==='percent'?'selected':''}>نسبة مئوية</option><option value="amount" ${p.thresholdType==='amount'?'selected':''}>مبلغ ثابت</option></select></div><div class="field"><label>الحد الأدنى</label><input id="pth" type="number" value="${p.threshold}"></div></div><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="saveProduct(${id||0})">حفظ المنتج</button></div>`)}
function lineRow(l={}){return `<div class="lineitems"><div class="field"><label>المادة</label><select class="lm">${db.materials.map(m=>`<option value="${m.id}" ${m.id===l.materialId?'selected':''}>${esc(sections[m.section]+' / '+m.name)}</option>`).join('')}</select></div><div class="field"><label>الكمية</label><input class="lq" type="number" step="0.0001" value="${l.qty||1}"></div><button class="btn danger" onclick="this.parentElement.remove()">حذف</button></div>`}function addLine(){document.getElementById('lines').insertAdjacentHTML('beforeend',lineRow())}
function saveProduct(id){let name=document.getElementById('pn').value.trim();if(!name)return alert('أدخل اسم المنتج');let lines=[...document.querySelectorAll('#lines .lineitems')].map(r=>({materialId:Number(r.querySelector('.lm').value),qty:Number(r.querySelector('.lq').value)}));let p={id:id||Date.now(),name,code:document.getElementById('pc').value,category:document.getElementById('pg').value,price:Number(document.getElementById('pp').value),lines,labor:Number(document.getElementById('pl').value),overhead:Number(document.getElementById('po').value),thresholdType:document.getElementById('pt').value,threshold:Number(document.getElementById('pth').value)};if(id)db.products=db.products.map(x=>x.id===id?p:x);else db.products.push(p);audit(id?'تعديل منتج':'إضافة منتج',name);closeModal();render()}
function updateFx(){let v=Number(document.getElementById('fx').value);if(!(v>0))return alert('سعر صرف غير صحيح');db.fx=v;audit('تعديل سعر الدولار',String(v));render()}
function editRule(i){let r=db.rules[i];openModal('تعديل قاعدة الحساب',`<div class="field"><label>اسم القاعدة</label><input id="rn" value="${esc(r.name)}"></div><div class="field" style="margin-top:10px"><label>الوصف</label><input id="rd" value="${esc(r.description)}"></div><div class="field" style="margin-top:10px"><label>القيمة</label><input id="rv" value="${esc(r.value)}"></div><button class="btn primary" style="margin-top:14px" onclick="db.rules[${i}].name=document.getElementById('rn').value;db.rules[${i}].description=document.getElementById('rd').value;db.rules[${i}].value=document.getElementById('rv').value;audit('تعديل قاعدة حساب',db.rules[${i}].name);closeModal();render()">حفظ التغيير</button>`)}
function userForm(){openModal('إضافة مستخدم (عرض توضيحي)',`<div class="field"><label>اسم المستخدم</label><input id="un"></div><div class="field" style="margin-top:10px"><label>الدور</label><select id="ur"><option>Accountant</option><option>Production</option><option>Materials</option><option>Viewer</option></select></div><button class="btn primary" style="margin-top:14px" onclick="let n=document.getElementById('un').value.trim();if(!n)return alert('أدخل الاسم');db.users.push({name:n,role:document.getElementById('ur').value,permissions:'تحدد لاحقاً'});audit('إضافة مستخدم',n);closeModal();render()">إضافة</button>`)}
document.getElementById('nav').addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b){page=b.dataset.page;render()}});render();
</script></body></html>
